apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    namespace 'dev.pthomain.android.dejavu.demo'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "1.2"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            multiDexEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            multiDexEnabled false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += [
                'META-INF/services/javax.annotation.processing.Processor',
                'META-INF/DEPENDENCIES.txt',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/DEPENDENCIES',
                'META-INF/ASL2.0',
                'META-INF/app_release.kotlin_module',
                'META-INF/notice.txt',
                'META-INF/license.txt',
                'META-INF/dependencies.txt',
                'META-INF/LGPL2.1',
                'META-INF/eclipse.inf',
                'about_files/LICENSE-2.0.txt',
                'plugin.xml',
                'plugin.properties'
            ]
        }
    }

}

dependencies {
    implementation project(':lib:core')
    implementation project(':lib:modules:http:retrofit')
    implementation project(':lib:modules:http:ktor')
    implementation project(':lib:modules:persistence:memory')
    implementation project(':lib:modules:persistence:sqlite')
    implementation project(':lib:modules:serialisation:kotlinx')
    implementation project(':lib:modules:serialisation:decorators:encryption')

    implementation libs.androidx.multidex


    implementation libs.okhttp
    implementation libs.okhttp.logging

    implementation libs.kotlinx.serialization.json

    implementation libs.androidx.appcompat
    implementation libs.androidx.browser
}
