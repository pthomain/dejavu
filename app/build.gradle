apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'dev.pthomain.android.dejavu.demo'
    compileSdk 35

    defaultConfig {
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            multiDexEnabled true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        release {
            multiDexEnabled false
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += [
                'META-INF/services/javax.annotation.processing.Processor',
                'META-INF/DEPENDENCIES.txt',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE.txt',
                'META-INF/NOTICE',
                'META-INF/LICENSE',
                'META-INF/DEPENDENCIES',
                'META-INF/ASL2.0',
                'META-INF/app_release.kotlin_module',
                'META-INF/notice.txt',
                'META-INF/license.txt',
                'META-INF/dependencies.txt',
                'META-INF/LGPL2.1',
                'META-INF/eclipse.inf',
                'about_files/LICENSE-2.0.txt',
                'plugin.xml',
                'plugin.properties'
            ]
        }
    }

}

dependencies {
    implementation project(':lib:core')
    implementation project(':lib:modules:http:retrofit')
    implementation project(':lib:modules:http:ktor')
    implementation project(':lib:modules:persistence:memory')
    implementation project(':lib:modules:persistence:sqlite')
    implementation project(':lib:modules:serialisation:kotlinx')
    implementation project(':lib:modules:serialisation:decorators:encryption')

    implementation libs.androidx.multidex

    implementation libs.okhttp
    implementation libs.okhttp.logging

    implementation libs.kotlinx.serialization.json

    // Compose
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
