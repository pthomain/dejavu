[versions]
# Core Android/Kotlin
kotlin = "2.1.0"
agp = "8.7.3"
compileSdk = "35"
minSdk = "24"
targetSdk = "35"
coroutines = "1.10.1"
ksp = "2.1.0-1.0.29"

# AndroidX
androidxCore = "1.15.0"
androidxAppcompat = "1.7.0"
androidxSqlite = "2.4.0"
androidxRoom = "2.6.1"
androidxBrowser = "1.8.0"
androidxMultidex = "2.0.1"
androidxTestCore = "1.6.1"
androidxTestRunner = "1.6.2"
androidxTestRules = "1.6.1"
androidxTestJunit = "1.2.1"

# Serialization
moshi = "1.15.2"
kotlinxSerialization = "1.7.3"

# Networking
retrofit = "2.11.0"
okhttp = "4.12.0"
ktor = "3.0.3"

# DI
koin = "4.0.2"

# Security
tink = "1.16.0"

# Testing
junit = "4.13.2"
mockito = "5.14.2"
mockitoKotlin = "5.4.0"
robolectric = "4.14.1"

# TODO: Remove in Phase 2 - RxJava being replaced with coroutines
rxjava = "2.2.19"
rxkotlin = "2.4.0"
rxandroid = "2.1.1"
rxdogtag = "1.0.0"

# TODO: Remove in Phase 3 - Volley being removed
volley = "1.1.1"

# TODO: Remove in Phase 3 - Gson being replaced with kotlinx.serialization
gson = "2.8.6"

# TODO: Remove in Phase 4 - Snappy compression being removed
snappy = "0.4"

# TODO: Remove in Phase 3 - Boilerplate being inlined
boilerplate = "4.3"

# TODO: Remove in Phase 3 - Glitchy being inlined
glitchy = "2.9"

# TODO: Remove in Phase 3 - Mumbo being replaced with Tink
mumbo = "2.8"

# TODO: Remove in Phase 3 - FlipTables being removed
fliptables = "1.1.0"

# TODO: Remove in Phase 2 - ReactiveNetwork is RxJava-based
reactiveNetwork = "3.0.8"

# TODO: Remove in Phase 4 - Requery being replaced with Room
requery = "3.25.3"

# TODO: Remove in Phase 3 - JitPack dependency
jitpack = "1.0"

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# AndroidX
androidx-core = { module = "androidx.core:core", version.ref = "androidxCore" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "androidxRoom" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "androidxRoom" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "androidxRoom" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "androidxMultidex" }

# AndroidX Test
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

# Serialization
moshi = { module = "com.squareup.moshi:moshi", version.ref = "moshi" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }

# Networking
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# DI
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

# Security
tink = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

# Ktor (NEW - for future Ktor module)
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Testing
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# TODO: Remove in Phase 2 - RxJava being replaced with coroutines
rxjava = { module = "io.reactivex.rxjava2:rxjava", version.ref = "rxjava" }
rxkotlin = { module = "io.reactivex.rxjava2:rxkotlin", version.ref = "rxkotlin" }
rxandroid = { module = "io.reactivex.rxjava2:rxandroid", version.ref = "rxandroid" }
rxdogtag = { module = "com.uber.rxdogtag:rxdogtag", version.ref = "rxdogtag" }

# TODO: Remove in Phase 3 - Volley being removed
volley = { module = "com.android.volley:volley", version.ref = "volley" }

# TODO: Remove in Phase 3 - Gson being replaced with kotlinx.serialization
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# TODO: Remove in Phase 4 - Snappy compression being removed
snappy = { module = "org.iq80.snappy:snappy", version.ref = "snappy" }

# TODO: Remove in Phase 3 - Boilerplate being inlined
boilerplate-core = { module = "dev.pthomain.boilerplate:core", version.ref = "boilerplate" }
boilerplate-ui = { module = "dev.pthomain.boilerplate:ui", version.ref = "boilerplate" }

# TODO: Remove in Phase 3 - Glitchy being inlined
glitchy-core = { module = "dev.pthomain.glitchy:core", version.ref = "glitchy" }
glitchy-retrofit = { module = "dev.pthomain.glitchy:retrofit", version.ref = "glitchy" }

# TODO: Remove in Phase 3 - Mumbo being replaced with Tink
mumbo = { module = "dev.pthomain:mumbo", version.ref = "mumbo" }

# TODO: Remove in Phase 3 - FlipTables being removed
fliptables = { module = "com.jakewharton.fliptables:fliptables", version.ref = "fliptables" }

# TODO: Remove in Phase 2 - ReactiveNetwork is RxJava-based
reactiveNetwork = { module = "com.github.pwittchen:reactivenetwork-rx2", version.ref = "reactiveNetwork" }

# TODO: Remove in Phase 4 - Requery being replaced with Room
requery = { module = "io.requery:sqlite-android", version.ref = "requery" }

# TODO: Remove in Phase 3 - JitPack dependency
jitpack = { module = "com.github.jitpack:gradle-simple", version.ref = "jitpack" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
